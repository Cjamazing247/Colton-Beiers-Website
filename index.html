<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextRun Flow 2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#050505;font-family:Inter;color:var(--text)}button,input{font:inherit}.app{--bg:#08090b;--card:#121318;--soft:#1a1b20;--text:#fff;--muted:#9ca3af;--line:#ff6a0055;min-height:100dvh;background:radial-gradient(circle at 90% 5%,#52230d,transparent 28%),var(--bg);padding:48px 18px 100px}.app.light{--bg:#fbfaf8;--card:#fff;--soft:#edf0f2;--text:#111;--muted:#6b7280;--line:#ddd;background:#fbfaf8}.app h1,.app h2,.app h3{font-family:Montserrat;font-style:italic}.app h1{margin:0;font-size:26px}.app p{color:var(--muted)}.eyebrow{margin:0!important;color:#ff6a00!important;font:10px 'JetBrains Mono';letter-spacing:2px;text-transform:uppercase}.panel{margin:12px 0;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card);box-shadow:0 8px 24px #0002}.hero{min-height:155px;background:linear-gradient(#1a0d07aa,#08090be6),url('./assets/f23e4.svg') center/cover}.brand{font:italic 800 27px Montserrat}.brand i{color:#ff6a00}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.primary,.pill{border:1px solid #ff6a00;border-radius:18px;color:#fff;background:linear-gradient(#ff8129,#ff6200);cursor:pointer}.primary{width:100%;min-height:52px;font-weight:600}.pills{display:flex;gap:8px;margin:12px 0;overflow:auto}.pill{min-height:40px;padding:0 18px;white-space:nowrap}.pill:not(.on){border-color:var(--line);color:var(--text);background:var(--card)}.muted{color:var(--muted)}.court{position:relative;height:250px;border:2px solid #ff6a00;border-radius:18px;background:linear-gradient(#ff6a0022,#0008),url('./assets/f23e4.svg') center 35%/cover;overflow:hidden}.court:before{content:'';position:absolute;inset:25px;border:4px solid #ff6a00;clip-path:polygon(0 100%,22% 0,78% 0,100% 100%)}.court:after{content:'';position:absolute;top:50%;left:50%;width:95px;height:45px;border:3px solid #ff6a00;border-radius:50%;transform:translate(-50%,-50%)}.row{display:flex;min-height:58px;border-top:1px solid #ffffff18;align-items:center;gap:12px}.avatar{display:block;width:40px;height:43px;border:1px solid #ff6a00;border-radius:12px;background:radial-gradient(circle at 55% 23%,#fff 0 9%,#a94a16 10% 35%,#21100a 70%)}.grow{flex:1}.dot{width:10px;height:10px;border-radius:50%;background:#16d777}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats b{display:block;margin-top:8px;font:italic 800 28px Montserrat}.card{position:relative;width:235px;height:330px;margin:18px auto;border:3px solid #ff6a00;border-radius:24px;padding:18px;background:radial-gradient(circle,#ff6a0066,transparent 38%),linear-gradient(145deg,#682804,#08090b 70%);box-shadow:0 0 25px #ff6a0066}.card>strong{display:block;font:italic 800 50px Montserrat}.card .person{position:absolute;top:120px;left:50%;font-size:75px;color:#ff6a00;transform:translateX(-50%)}.card h2{position:absolute;bottom:34px}.blank{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:55px 22px}.blank i{border:1px solid #fff;border-radius:18px;background:#0005}.input{width:100%;height:50px;margin:5px 0;border:1px solid var(--line);border-radius:13px;padding:0 14px;color:var(--text);background:var(--soft)}.toggle{width:54px;height:30px;border:0;border-radius:20px;padding:3px;background:#30333a}.toggle i{display:block;width:24px;height:24px;border-radius:50%;background:#98a1af}.toggle.on{background:#ff6a00}.toggle.on i{margin-left:24px;background:#fff}.setting{display:flex;align-items:center;justify-content:space-between}.nav{position:fixed;z-index:5;right:14px;bottom:10px;left:14px;display:grid;grid-template-columns:repeat(5,1fr);height:72px;border:1px solid var(--line);border-radius:30px;padding:5px;background:var(--card);box-shadow:0 8px 30px #0007}.nav button{border:0;color:var(--muted);background:none;font-size:10px}.nav button b{display:block;font-size:22px}.nav .sel{color:#ff6a00}.nav .capture{width:62px;height:62px;align-self:center;justify-self:center;border:5px solid var(--card);border-radius:50%;color:white;background:#ff6a00;font-size:22px}.scan{text-align:center;padding-top:40px}.scanbox{width:220px;height:255px;margin:28px auto;border:2px solid #ff6a00;border-radius:23px;background:radial-gradient(ellipse,#ff6a0033,transparent 55%);box-shadow:0 0 28px #ff6a0066}.scanbox:before{content:'';display:block;width:95px;height:140px;margin:48px auto;border:2px solid #ff6a00;border-radius:50%}.list .row span small{display:block;color:var(--muted)}.upload{text-align:center}.upload div{display:grid;height:210px;border-radius:16px;place-items:center;background:url('./assets/f23e4.svg') center/cover;font-size:65px;color:#ff6a00}@media(min-width:760px){.app>main{max-width:760px;margin:auto}.nav{right:calc(50% - 360px);left:calc(50% - 360px)}}</style></head><body><div id="root"></div><script>const P=[['PlayerOne','In a game · 2h'],['Hooper23','At practice · 34m'],['BallsLife','Offline · 3h'],['CourtVision','In club · 1h'],['BucketsOnly','Offline · 5h'],['DunkMaster','Busy · 45m']];let state={scan:false,page:'home',light:false,club:'Leaderboard',scout:'Live'};const row=(p,i='')=>`<div class="row"><i class="avatar"></i><span class="grow"><b>${p[0]}</b><small>${p[1]||''}</small></span>${i||'<i class="dot"></i>'}</div>`;function nav(){return `<nav class="nav">${[['home','⌂','Home'],['club','♢','Club Hub'],['scout','▣',''],['crew','♧','Friends'],['profile','♙','Profile']].map(x=>`<button data-page="${x[0]}" class="${state.page==x[0]?'sel ':''}${x[0]=='scout'?'capture':''}"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}function home(){return `<main><div class="top"><b class="brand">Next<i>Run</i></b><button class="pill">♢</button></div><p class="eyebrow">Welcome back</p><h1>Jordan</h1><p>Keep pushing.</p><section class="panel hero"><p class="eyebrow">The locker room</p><h2>ANALYZE<br>IMPROVE<br>COMPETE</h2><button class="primary" data-page="scout">Start session →</button></section><section class="panel"><h3>Your progress</h3><div class="stats"><div><small>Latest game</small><b>72%</b></div><div><small>PTS</small><b>18</b><small>AST 6 · REB 4</small></div></div></section></main>`}function club(){let board=P.slice(0,5).map((p,i)=>row(p,`<b>${[248,231,219,201,190][i]}</b>`)).join('');return `<main><section class="panel hero"><p class="eyebrow">Club hub</p><h1>Westwood Ballers</h1><p>12 members · Dallas, TX</p><h2>72% <small>win rate</small></h2></section><div class="pills">${['Leaderboard','Activity','Tournaments','Setup'].map(x=>`<button data-club="${x}" class="pill ${state.club==x?'on':''}">${x}</button>`).join('')}</div>${state.club=='Tournaments'?`<section class="panel"><h3>Summer Showdown</h3><p>8 teams · single elimination</p>${['Quarterfinals — Sat 4 PM','Semifinals — Sun 2 PM','Finals — Sun 6 PM'].map(x=>`<div class="panel">${x}</div>`).join('')}</section>`:`<section class="panel list"><h3>Top 5 this week</h3>${board}</section><h3>Team stats</h3><div class="stats">${[['Points','84.3'],['Rebounds','36.7'],['Assists','18.2'],['Steals','9.4']].map(x=>`<div class="panel"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`}</main>`}function scout(){return `<main><p class="eyebrow">Scouting</p><h1>Scouting camera</h1><div class="pills">${['Live','Upload','Library'].map(x=>`<button data-scout="${x}" class="pill ${state.scout==x?'on':''}">${x}</button>`).join('')}</div>${state.scout=='Upload'?`<section class="panel upload"><h2>Upload game footage</h2><div>▣</div><p>Drag a game video here or choose a file.</p><button class="primary">Choose video</button></section>`:`<div class="pills"><button class="pill on">Casual Pickup</button><button class="pill">Tournament Game</button><button class="pill">Solo Drills</button></div><div class="court"></div><section class="panel list"><h3>Roster</h3>${P.slice(0,5).map(p=>row(p,'<span>A　B</span>')).join('')}</section>`}</main>`}function crew(){return `<main><section class="panel hero"><p class="eyebrow">Squad</p><h1>The Crew</h1><p>4 online now</p></section><input class="input" placeholder="Search friends, clubs, handles"><div class="pills"><button class="pill on">Active</button><button class="pill">Messages</button><button class="pill">Rivalry</button></div><section class="list">${P.map(p=>`<div class="panel">${row(p)}</div>`).join('')}</section></main>`}function profile(){return `<main><div class="top"><div><p class="eyebrow">Profile</p><h1>Player card</h1></div><button data-page="settings" class="pill">☼</button></div><div class="card"><small>OVR　　　　 PG</small><strong>92</strong><span class="person">♟</span><h2>@playerone</h2></div><button class="primary" data-page="builder">Build a custom card</button><h3>Attributes</h3><section class="panel">Shooting　92<hr>Playmaking　88<hr>Athleticism　85<hr>Defense　78</section></main>`}function builder(){return `<main><div class="top"><button data-page="profile" class="pill">‹</button><h1>Custom card</h1></div><div class="card blank">${'<i></i>'.repeat(6)}</div><p style="text-align:center">Tap the card to flip</p><button class="primary">Upload selfie</button><section class="panel"><h3>Identity</h3><input class="input" placeholder="Player name"><input class="input" value="Rookie"><div class="pills"><button class="pill on">Rookie</button><button class="pill">Sniper</button><button class="pill">Floor General</button></div><input class="input" value="24"><input class="input" value="PG"></section><section class="panel"><h3>Shape</h3><div class="pills"><button class="pill on">Standard</button><button class="pill">Rounded</button><button class="pill">Arch</button></div><h3>Design</h3><div class="pills"><button class="pill on">Court</button><button class="pill">Lines</button><button class="pill">Dots</button></div></section></main>`}function settings(){return `<main><div class="top"><button data-page="profile" class="pill">‹</button><h1>Settings</h1></div><section class="panel hero"><p class="eyebrow">NextRun</p><h2>NextRun Lab</h2><p>Turn on your potential.</p></section><section class="panel setting"><span><b>Light mode</b><small>Switch app theme</small></span><button id="theme" class="toggle ${state.light?'on':''}"><i></i></button></section><section class="panel"><h3>Accent color</h3><p>Pick a neon color for buttons, glows and highlights.</p><div class="pills"><button class="pill on">● Orange</button><button class="pill">● Cyan</button><button class="pill">● Lime</button></div></section><section class="panel"><h3>Privacy</h3><div class="pills"><button class="pill">Public</button><button class="pill on">Club</button><button class="pill">Private</button></div></section><section class="panel"><h3>Processing queue</h3><p>2 uploading</p></section></main>`}function render(){let body;if(!state.scan)body=`<main class="scan"><h1>Face scan</h1><p>Center your face so teammates can be tagged in footage.</p><div class="scanbox"></div><button id="continue" class="primary">Continue</button></main>`;else body=({home,club,scout,crew,profile,builder,settings})[state.page]()+nav();root.innerHTML=`<div class="app ${state.light?'light':''}">${body}</div>`}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id=='continue')state.scan=true;if(b.dataset.page)state.page=b.dataset.page;if(b.dataset.club)state.club=b.dataset.club;if(b.dataset.scout)state.scout=b.dataset.scout;if(b.id=='theme')state.light=!state.light;render()});render();</script></body></html>
